# 푸시와 PR마다 빌드가 되는지 본다.
#
# 이 앱은 glasses-ui를 file:../glasses-ui 로 참조한다. 저장소는 나뉘어
# 있지만 빌드는 짝이라, 옆에 체크아웃해 주지 않으면 npm ci가 실패한다.
#
#   작업공간/
#     glasses-g2/   ← 이 저장소
#     glasses-ui/   ← 아래 단계가 받아온다

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: glasses-g2

      # file: 의존을 풀려면 형제 위치에 있어야 한다.
      - uses: actions/checkout@v4
        with:
          repository: foncdev/glasses-ui
          path: glasses-ui

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glasses-g2/package-lock.json

      - name: 의존성
        # file: 의존이 있어 lock과 어긋날 수 있다. ci가 막히면 install로 떨어진다.
        run: npm ci || npm install
        working-directory: glasses-g2

      - name: 빌드
        # vite build 앞에 tsc가 돌아 타입 오류도 여기서 걸린다.
        run: npm run build
        working-directory: glasses-g2

      - name: 매니페스트 확인
        # app.json이 깨지면 안경에 설치가 안 된다. 빌드로는 안 걸린다.
        run: |
          node -e "
            const m = require('./app.json');
            for (const k of ['package_id','name','version','entrypoint']) {
              if (!m[k]) { console.error('app.json에', k, '이(가) 없습니다'); process.exit(1); }
            }
            console.log('app.json OK:', m.package_id, m.version);
          "
        working-directory: glasses-g2
